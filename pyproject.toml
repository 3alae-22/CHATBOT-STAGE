[project]
name = "chatbot-stage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.116.0",
    "bm25s>=0.3.9",
    "deepeval>=4.0.7",
    "fastapi>=0.139.0",
    "google-genai>=2.10.0",
    "ipykernel>=7.3.0",
    "langchain-google-genai>=4.2.7",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.13.0",
    "langgraph>=1.2.7",
    "load-dotenv>=0.1.0",
    "locust>=2.44.4",
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
    "ollama>=0.6.2",
    "paddleocr>=3.4.1",
    "paddlepaddle<3.3",
    "passlib[bcrypt]>=1.7.4",
    "pgvector>=0.4.2",
    "psycopg2>=2.9.12",
    "pymupdf>=1.28.0",
    "pypdf>=6.14.2",
    "pystemmer>=3.1.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "ragas==0.3.9",
    "sentence-transformers>=5.6.0",
    "streamlit>=1.58.0",
    "uvicorn>=0.50.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "notebooks*", "postgres*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]
